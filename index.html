  html, body { background: var(--bg); color: var(--fg); }

  /* Каскадное появление: элемент скрыт, пока IntersectionObserver не поставит data-in; --d задаёт очередь */
  [data-r] { opacity: 0; }
  [data-r][data-in] { opacity: 1; animation: rise .75s cubic-bezier(.22,.8,.24,1) backwards; animation-delay: calc(var(--d, 0) * 80ms); }

  @keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { animation: sheet .35s cubic-bezier(.2,.8,.2,1) both; }
  .scrim { animation: fade .25s ease both; }
  /* Живые кнопки: быстрое прожатие до .95 и упругий возврат */
  .press { transition: transform .45s cubic-bezier(.34,1.56,.64,1), background-color .2s ease, border-color .2s ease, box-shadow .2s ease; will-change: transform; }
  .press:active { transform: scale(.95); transition-duration: .12s, .2s, .2s, .2s; }
  .press-lg:active { transform: scale(.975); }
  @media (hover: hover) { .press:hover { filter: brightness(1.08); } }
  /* Стекло + бегущий блик на плашках «Что я делаю» */
  .glass { background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.07); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .shine { position: relative; overflow: hidden; isolation: isolate; }
  .shine::after { content: ''; position: absolute; inset: -20% 0; z-index: 1; pointer-events: none; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.13) 50%, transparent 62%); transform: translateX(-130%); animation: shine 6s ease-in-out infinite; animation-delay: calc(1.4s + var(--s, 0) * .9s); }
  @keyframes shine { 0% { transform: translateX(-130%); } 32%, 100% { transform: translateX(130%); } }
  /* Аккордеон: высота, поворот стрелки и появление контента на одной кривой */
  .acc { transition: grid-template-rows .5s cubic-bezier(.32,.72,0,1); }
  .chev { transition: transform .5s cubic-bezier(.32,.72,0,1); }
  .acc-in { opacity: 0; transform: translateY(-8px); visibility: hidden; transition: opacity .3s ease, transform .5s cubic-bezier(.32,.72,0,1), visibility 0s linear .5s; }
  .acc-in.is-open { opacity: 1; transform: none; visibility: visible; transition-delay: .08s, .08s, 0s; }
  /* Главная кнопка: пульсирующее свечение и смена текста */
  .glow { animation: glow 2.6s ease-in-out infinite; }

  .swap { animation: swap .35s cubic-bezier(.22,.8,.24,1) backwards; }
  @keyframes swap { from { opacity: 0; transform: translateY(8px); } }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {

    .acc, .chev, .acc-in { transition-duration: .01s; }
    html { scroll-behavior: auto; }
  }
