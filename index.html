<style>
  /* Layout: узкая колонка «экран телефона» по центру, Telegram MainButton закреплена снизу */
  :root {
    --bg: #09090b;
    --surface: #131316;
    --surface-2: #1c1c21;
    --line: #26262c;
    --fg: #f4f4f5;
    --muted: #8e8e99;
    --accent: #2AABEE;
    --accent-ink: #04141d;
    --font-display: 'Unbounded', 'Onest', system-ui, sans-serif;
    --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: var(--font-body); font-size: 15px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  .font-display { font-family: var(--font-display); }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { animation: sheet .35s cubic-bezier(.2,.8,.2,1) both; }
  .scrim { animation: fade .25s ease both; }
  .press { transition: transform .15s ease, background-color .2s ease, border-color .2s ease; }
  .press:active { transform: scale(.97); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .sheet, .scrim { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
